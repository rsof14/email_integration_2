<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Письма</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .email-text {
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 100px;
            display: block;
            position: relative;
            width: 100%;
        }
        .table-container {
            overflow-x: hidden;
        }
        table {
            table-layout: fixed;
            width: 100%;
        }
        th, td {
            word-wrap: break-word;
        }
        td {
            vertical-align: top;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-end mt-3">
            <button id="refresh" class="btn btn-primary">Обновить</button>
        </div>

        <nav aria-label="Page navigation" class="my-3">
            <ul class="pagination">
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
            </ul>
        </nav>

        <div class="table-container">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th style="width: 100px;">Дата</th>
                        <th style="width: 150px;">Отправитель</th>
                        <th style="width: 200px;">Тема</th>
                        <th style="width: 300px;">Текст письма</th>
                        <th style="width: 100px;">Вложения</th>
                    </tr>
                </thead>
                <tbody>
                    {% for email in emails %}
                    <tr>
                        <td>{{ email.date }}</td>
                        <td>{{ email.from_email }}</td>
                        <td>{{ email.topic }}</td>
                        <td>
                            <div class="email-text">{{ email.message_text }}</div>
                        </td>
                        <td></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('refresh').addEventListener('click', function(event) {
            event.preventDefault();
            fetch('/email/update', {method: 'POST'});
        })
    </script>
</body>
</html>
